server:
  port: 8083

spring:
  application:
    name: wallet-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet_db}
    username: ${DB_USER:wallet}
    password: ${DB_PASSWORD:wallet}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:cafeorbe}
    password: ${RABBIT_PASSWORD:cafeorbe}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1s
          multiplier: 2

cafeorbe:
  wallet:
    # Orbes que recibe un Comprador la primera vez que ingresa (HU-07)
    saldo-inicial: ${WALLET_SALDO_INICIAL:1000}

management:
  endpoints:
    web:
      exposure:
        include: health
